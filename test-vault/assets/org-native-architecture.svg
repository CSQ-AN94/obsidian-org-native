<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="Org Native Architecture Diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c8ef7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="220" rx="12" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <rect x="28" y="48" width="180" height="124" rx="10" fill="#262e3d" stroke="#5c6f91" stroke-width="1.5"/>
    <text x="118" y="88" fill="#e6edf3" font-size="16" font-weight="700">Emacs / Org Mode</text>
    <text x="118" y="114" fill="#9fb0c7" font-size="12">Source of Truth (.org)</text>
    <text x="118" y="136" fill="#9fb0c7" font-size="11">LF/CRLF · :ID: · #+TRANSCLUDE</text>

    <line x1="208" y1="110" x2="262" y2="110" stroke="#7c8ef7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="268" y="34" width="184" height="152" rx="10" fill="#242942" stroke="#7c8ef7" stroke-width="1.8"/>
    <text x="360" y="68" fill="#e6edf3" font-size="16" font-weight="700">Org Native Core</text>
    <text x="360" y="96" fill="#b4c0ff" font-size="12">OrgDoc + SectionTree</text>
    <text x="360" y="118" fill="#b4c0ff" font-size="12">OrgIdIndex + SyncGuard</text>
    <text x="360" y="140" fill="#b4c0ff" font-size="12">Read-only Transclusion</text>
    <text x="360" y="164" fill="#8fa0c7" font-size="11">Zero Source Mutation</text>

    <line x1="452" y1="110" x2="506" y2="110" stroke="#7c8ef7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="512" y="48" width="180" height="124" rx="10" fill="#262e3d" stroke="#4ea8de" stroke-width="1.5"/>
    <text x="602" y="88" fill="#e6edf3" font-size="16" font-weight="700">Obsidian Layer</text>
    <text x="602" y="114" fill="#9fb0c7" font-size="12">Reading · Live · Source</text>
    <text x="602" y="136" fill="#9fb0c7" font-size="11">Backlinks · Hover · MathJax</text>
  </g>
